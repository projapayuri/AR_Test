<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Physics Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <!-- 物理エンジン -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>
</head>


<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    physics="gravity: -9.8"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
  >

    <!-- 素材 -->
    <a-assets>

      <img
        id="brick"
        src="assets/images/brick.jpg"
      >

      <img
        id="metal"
        src="assets/images/earth.jpg"
      >

      <img
        id="grass"
        src="assets/images/grassland2.jpg"
      >

    </a-assets>


<a-marker preset="hiro">

  <a-gltf-model
    src="assets/models/robot.glb"
    position="0 0 0"
    scale="0.5 0.5 0.5"
    animation="
      property: rotation;
      from: 0 0 0;
      to: 0 360 0;
      dur: 5000;
      loop: true;
      easing: linear;
    ">
  </a-gltf-model>

</a-marker>


    <!-- AR用カメラ -->
    <a-entity
      id="camera"
      camera>
    </a-entity>


  </a-scene>
  
</body>

</html>
