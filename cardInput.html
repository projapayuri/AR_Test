<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: aliceblue;
        }

        .card {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            background-color: white;
            width: 240px;
            text-align: center;
            padding: 40px 28px;

            border-radius: 12px;
            margin: 60px auto;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e5e7eb;
        }

        .card-title {
            margin-bottom: 12px;
        }

        .card-text {
            color: #6b7280;
            font-size: 12px
        }

        button {
            border: none;
            padding: 10px 40px;
            background-color: #fa9e68;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 999px;
            margin-top: 10px;
        }

        input {
            width: 100%;
            height: 20px;
        }
    </style>
</head>

<body>
    <article class="card" id="card">
        <img class="card-img" src="./slime.png" alt="">
        <h2 class="card-title">スライム</h2>
        <p id="p" class="card-text"></p>
        <input id="input" type="text">
        <button onclick="showText()">表示</button>
    </article>

    <script>
        const input = document.getElementById("input");
        const p = document.getElementById("p");

        function showText() {
            p.textContent = input.value;
            input.hidden = true;
        }
    </script>
</body>

</html>
