<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR HP Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Hiroマーカー -->
   <a-marker preset="hiro">

  <a-plane
    rotation="-90 0 0"
    width="4"
    height="4"
    src="#grass"
    static-body>
  </a-plane>

  <a-sphere
    id="ball"
    class="clickable"
    src="#metal"
    position="0 0.25 1.3"
    radius="0.25"
    dynamic-body>
  </a-sphere>

  <a-box
    src="#brick"
    width="0.5"
    height="0.5"
    depth="0.5"
    position="0 0.25 -0.7"
    dynamic-body
    class="target">
  </a-box>

  <a-box
    src="#brick"
    width="0.5"
    height="0.5"
    depth="0.5"
    position="0.5 0.25 -0.7"
    dynamic-body
    class="target">
  </a-box>

  <a-box
    src="#brick"
    width="0.5"
    height="0.5"
    depth="0.5"
    position="-0.5 0.25 -0.7"
    dynamic-body
    class="target">
  </a-box>

</a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
        const ball = document.getElementById("ball")

        const camera = document.getElementById("camera");

        const countText = document.getElementById("countText");

        let count = 0;
        function shootBall() {

            const direction = new THREE.Vector3();

            // カメラが向いている方向を取得
            camera.object3D.getWorldDirection(direction);

            const power = -500;

            ball.body.applyImpulse(
                new CANNON.Vec3(
                    direction.x * power,
                    direction.y * power,
                    direction.z * power
                )
            );
        }

        ball.addEventListener("click", shootBall);

        function hit(event) {
            const enemy = event.detail.body.el;  //接触イベントが起きた対象をenemyとする

            if (enemy.classList.contains("target")) {  //enemyのidがtargetだったら
                enemy.setAttribute("opacity", "0.4");  //enemyの色を赤にする
                count++;  
            }

            countText.setAttribute("value", count + " Hit" );
        }

        ball.addEventListener("collide", hit);
  </script>

</body>
</html>
