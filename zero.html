
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>2種類のマーカーAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> 

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<a-scene
  embedded
  arjs="sourceType: webcam">

    <a-marker preset="hiro" smooth="true">

            <a-entity position="0 -1 0.5" scale="0.5 0.5 0.5" rotation="-90 0 0">
                <a-cylinder
                    position="0 3 -5"
                    radius="0.2"
                    height="0.7"
                    color="red"></a-cylinder>
                <a-sphere
                    position="0 2.4 -5"
                    radius="0.7"
                ></a-sphere>
                <a-sphere
                    position="0.2 2.45 -4.3"
                    color="black"
                    radius="0.06"
                    ></a-sphere>
                <a-box
                    position="0 2.1 -4.4"
                    color="black"
                    width="0.4"
                    height="0.1"
                    depth="0.1"
                ></a-box>
                <a-sphere
                    position="-0.2 2.45 -4.3"
                    color="black"
                    radius="0.06"
                    ></a-sphere>
                <a-sphere
                    position="0 1 -5"
                ></a-sphere>
            </a-entity>

    </a-marker>

    <!-- AR用カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
