
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>2種類のマーカーAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script> 

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<a-scene
  embedded
  arjs="sourceType: webcam">

   <a-marker preset="hiro">
  <a-cylinder position="0 0.05 0" radius="0.6"
              height="0.1" color="#444"></a-cylinder>

  <a-gltf-model src="robot.glb"
    position="0 0.18 0" scale="0.5 0.5 0.5"
    animation="property: rotation; to: 0 360 0;
               dur: 8000; loop: true; easing: linear">
  </a-gltf-model>
</a-marker>


    <!-- AR用カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
