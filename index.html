<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR Physics Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<!-- GLBのアニメーション再生用 -->
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>
</head>


<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    physics="gravity: -9.8"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
  >


<a-marker preset="hiro">

  <a-gltf-model
    src="assets/models/robot.glb"
    position="0 0 0"
    scale="0.5 0.5 0.5"
animation-mixer="clip: *Robot_Walking
    ">
  </a-gltf-model>

</a-marker>


    <!-- AR用カメラ -->
    <a-entity
      id="camera"
      camera>
    </a-entity>


  </a-scene>
  
</body>

</html>
