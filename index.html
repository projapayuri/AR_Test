<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AR HP Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Hiroマーカー -->
    <a-marker preset="hiro">

<a-asset>
            <img id="brick" src="../assets/images/brick.jpg" alt="">
            <img id="metal" src="../assets/images/earth.jpg" alt="">
            <img id="grass" src="../assets/images/grassland2.jpg" alt="">
            <img src="" alt="">
        </a-asset>

        <a-plane rotation="-90 0 0" width="50" height="50" color="darkseagreen" static-body src="#grass"></a-plane>
        <a-sphere src="#metal" position="0 1 20" color="skyblue" radius="0.7" dynamic-body id="ball"
            class="clickable"></a-sphere>

        <a-text
            value="0"
            position="0 2 10"
            id="countText"
            color="white"
            align="center"
            scale="6 6 6"
        ></a-text>
                <a-plane
            position="0 2 10"
            width="2"
            height="0.7" 
            color="black"
            opacity="0.5"
            scale="3 3 3"   
        ></a-plane>
        <a-box src="#brick" width="5" height="5" depth="5" position="0 2.51 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="5 2.51 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="-5 2.51 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="-2.5 7.5 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="2.5 7.5 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="0 12.5 -1" dynamic-body class="target">
        </a-box>
        <a-box src="#brick" width="5" height="5" depth="5" position="0 17.5 -1" dynamic-body class="target">
        </a-box>

    </a-marker>

    <!-- カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
        const ball = document.getElementById("ball")

        const camera = document.getElementById("camera");

        const countText = document.getElementById("countText");

        let count = 0;
        function shootBall() {

            const direction = new THREE.Vector3();

            // カメラが向いている方向を取得
            camera.object3D.getWorldDirection(direction);

            const power = -500;

            ball.body.applyImpulse(
                new CANNON.Vec3(
                    direction.x * power,
                    direction.y * power,
                    direction.z * power
                )
            );
        }

        ball.addEventListener("click", shootBall);

        function hit(event) {
            const enemy = event.detail.body.el;  //接触イベントが起きた対象をenemyとする

            if (enemy.classList.contains("target")) {  //enemyのidがtargetだったら
                enemy.setAttribute("opacity", "0.4");  //enemyの色を赤にする
                count++;  
            }

            countText.setAttribute("value", count + " Hit" );
        }

        ball.addEventListener("collide", hit);
  </script>

</body>
</html>
