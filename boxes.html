<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

</head>

<body>
    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro">
  <a-box position="-0.4 0 0"
         scale="0.3 0.3 0.3"
         color="red"></a-box>

  <a-box position="0 0 0"
         scale="0.3 0.3 0.3"
         color="yellow"></a-box>

  <a-box position="0.4 0 0"
         scale="0.3 0.3 0.3"
         color="blue"></a-box>
  <a-box position="-0.4 0 -0.4"
         scale="0.3 0.3 0.3"
         color="orange"></a-box>

  <a-box position="0 0 -0.4"
         scale="0.3 0.3 0.3"
         color="lightgreen"></a-box>

  <a-box position="0.4 0 -0.4"
         scale="0.3 0.3 0.3"
         color="white"></a-box>

  <a-box position="-0.4 0 0.4"
         scale="0.3 0.3 0.3"
         color="purple"></a-box>

  <a-box position="0 0 0.4"
         scale="0.3 0.3 0.3"
         color="pink"></a-box>

  <a-box position="0.4 0 0.4"
         scale="0.3 0.3 0.3"
         color="gray"></a-box>

</a-marker>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>

</html>
