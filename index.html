<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
    <a-scene>
        <a-sky color="steelblue"></a-sky>

        <a-plane rotation="-90 0 0" width="10" height="10" color="darkseagreen">
        </a-plane>

        <a-octahedron position="0 1 -3" radius="0.7" color="purple" animation="
                        property: rotation;
                        to: 0 360 0;
                        loop: true;
                        easing: linear;
                        dur: 5000;
        ">
        </a-octahedron>


        <a-cylinder position="0 0.15 -3" radius="0.9" height="0.3" color="dimgray">
        </a-cylinder>

    </a-scene>
</body>

</html>
